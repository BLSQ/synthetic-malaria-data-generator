[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "malsim"
version = "0.1.0"
description = "Synthetic monthly malaria routine data for real DHIS2 facility pyramids"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "pyyaml>=6",
    "requests>=2.28",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3", "rasterstats>=0.19"]
test = ["pytest>=7"]

[project.scripts]
malsim = "malsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
